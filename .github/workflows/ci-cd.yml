name: Production MLOps Execution Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  continuous-integration-and-deployment:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code Repo
      uses: actions/checkout@v4

    - name: Mount Python Pipeline Runtime 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Initialize Verification Cache Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Core Test Harness Pipeline
      run: |
        python -m pytest src/tests/

    - name: Authenticate Container Registry Workspace (Docker Hub)
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Publish Production Backend Image Layer
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/emotion-api:latest

    - name: Build and Publish Production Frontend Image Layer
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./ui/Dockerfile.ui
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/emotion-ui:latest

    - name: Authenticate Kubernetes Target Context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: Execute GitOps Mesh Synchronization Updates
      run: |
        kubectl apply -f k8s/
        # Trigger an immediate rolling update to fetch your newly pushed container layers
        kubectl rollout restart deployment/emotion-api-deployment
        kubectl rollout restart deployment/emotion-ui-deployment