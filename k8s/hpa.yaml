apiVersion: apps/v1
kind: Deployment
metadata:
  name: emotion-ui-deployment
  labels:
    app: emotion-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emotion-ui
  template:
    metadata:
      labels:
        app: emotion-ui
    spec:
      containers:
      - name: emotion-ui-container
        image: your-dockerhub-username/emotion-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: emotion-ui-service
spec:
  type: NodePort             # Exposes the frontend externally to your local workstation
  selector:
    app: emotion-ui
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30085        # Access the UI at: http://localhost:30085 or http://<minikube-ip>:30085