apiVersion: apps/v1
kind: Deployment
metadata:
  name: emotion-api-deployment
  labels:
    app: emotion-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emotion-api
  template:
    metadata:
      labels:
        app: emotion-api
    spec:
      containers:
      - name: emotion-api-container
        image: your-dockerhub-username/emotion-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "500m"      # Half a core max allocation constraint
            memory: "512Mi"
          requests:
            cpu: "250m"      # Guaranteed base allocation reservation
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: emotion-api-service
spec:
  type: ClusterIP           # Keeps the backend securely isolated within the cluster
  selector:
    app: emotion-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000